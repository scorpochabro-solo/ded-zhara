name: Deploy design preview to GitHub Pages

# Собирает СТАТИЧЕСКУЮ дизайн-версию сайта (только внешний вид) и публикует
# на GitHub Pages. Серверные части (форма→БД, Telegram, /admin) на Pages не
# работают — они исключаются из этой сборки и живут только в полноценном деплое.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Включить GitHub Pages (если ещё не включён)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --ignore-scripts
      - name: Убрать серверные роуты (Pages = только статика/дизайн)
        run: rm -rf app/admin app/api
      - name: Сборка статического экспорта
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_DEMO: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          PAGES_BASE_PATH: "/${{ github.event.repository.name }}"
          NEXT_PUBLIC_SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: npx next build
      - name: Защита от Jekyll (чтобы папка _next не игнорировалась)
        run: touch .next-export/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
